{% extends "base.html" %}

{% block title %}404 - Halaman Tidak Ditemukan | HYPEWARE{% endblock %}

{% block content %}
<div class="container mx-auto px-6 py-24 text-center">
  <span class="material-icons-outlined text-6xl text-primary mb-4">error_outline</span>
  <h1 class="text-4xl font-display font-bold uppercase mb-2">404 - Halaman Tidak Ditemukan</h1>
  <p class="text-stone-500 text-sm max-w-md mx-auto mb-8">
    Maaf, halaman atau produk yang Anda cari tidak dapat ditemukan atau telah dipindahkan.
  </p>
  <a href="{{ url_for('index') }}" class="bg-primary text-white font-bold text-xs uppercase tracking-widest px-8 py-3.5 hover:bg-black transition inline-block">
    Kembali ke Beranda
  </a>
</div>
{% endblock %}
